<!DOCTYPE html>
<html lang="en" class="text-md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSS Volunteers 2025-26 | NSS Vettathur</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-slate-800 font-body">

<header class="sticky top-0 z-50 border-b border-slate-100 bg-white/80 backdrop-blur-md">
  <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex justify-between items-center">
    <a href="index.html" class="font-bold text-xl">NSS VETTATHUR</a>
    <nav class="hidden md:flex gap-6">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="activities.html">Activities</a>
      <a href="gallery.html">Gallery</a>
      <a href="team.html">Team</a>
      <a href="volunteer.html" class="text-primary font-semibold">Volunteers</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="py-20 bg-gradient-to-br from-blue-900 to-slate-900 text-white text-center">
  <div class="max-w-5xl mx-auto px-4">
    <span class="px-4 py-1 rounded-full bg-white/10">NSS Directory</span>
    <h1 class="text-5xl font-bold mt-5">NSS Volunteers 2025–26</h1>
    <p class="mt-4 text-slate-200">Meet the student volunteers serving the community.</p>
  </div>
</section>

<section class="py-10 bg-slate-50">
  <div class="max-w-7xl mx-auto px-4 md:px-8 grid grid-cols-2 lg:grid-cols-4 gap-6">
    <div class="bg-white rounded-2xl p-6 text-center shadow"><h3 id="stat-total" class="text-3xl font-bold">50</h3><p>Total</p></div>
    <div class="bg-white rounded-2xl p-6 text-center shadow"><h3 id="stat-male" class="text-3xl font-bold">0</h3><p>Male</p></div>
    <div class="bg-white rounded-2xl p-6 text-center shadow"><h3 id="stat-female" class="text-3xl font-bold">0</h3><p>Female</p></div>
    <div class="bg-white rounded-2xl p-6 text-center shadow"><h3 id="stat-blood" class="text-3xl font-bold">0</h3><p>Blood Groups</p></div>
  </div>
</section>

<section class="py-8">
<div class="max-w-7xl mx-auto px-4 md:px-8">
<div class="bg-white rounded-2xl border p-5 flex flex-col lg:flex-row gap-4">
<input id="volunteer-search" class="flex-1 border rounded-xl px-4 py-3" placeholder="Search volunteer...">
<select id="gender-filter" class="border rounded-xl px-4 py-3">
<option value="All">All Gender</option><option>Male</option><option>Female</option>
</select>
<select id="blood-filter" class="border rounded-xl px-4 py-3"><option value="All">All Blood Groups</option></select>
<select
  id="district-filter"
  class="border rounded-xl px-4 py-3"
>
  <option value="All">All Districts</option>
</select>

<select
  id="doy-filter"
  class="border rounded-xl px-4 py-3"
>
  <option value="All">All Years</option>
  <select id="doy-filter">
  <option value="All"></option>
</select>

</div>
</div>
</section>

<section class="pb-20">
<div class="max-w-7xl mx-auto px-4 md:px-8">

  <div class="flex justify-between items-center mb-6">

  <h2 class="font-bold text-xl">
    Volunteers
  </h2>

  <span
    id="result-count"
    class="text-sm text-slate-500"
  >
    0 Volunteers
  </span>

</div>

<div id="volunteer-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
<div id="no-volunteers" class="hidden text-center py-16 text-slate-400">No volunteers found.</div>
</div>
</section>

<div id="volunteer-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm p-4 flex items-center justify-center">
  <div class="bg-white rounded-3xl p-6 max-w-lg w-full relative">
    <button id="modal-close" class="absolute top-4 right-4">✕</button>
    <div id="volunteer-details"></div>
  </div>
</div>

<footer class="py-10 text-center border-t">© NSS Vettathur</footer>
<script src="volunteer.js"></script>
</body>
</html>
